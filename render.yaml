# Render Blueprint for the Karnataka travel planner (one web service serves the API and the page).
# Free tier: 512 MB RAM, 0.1 CPU, sleeps after 15 minutes without traffic (first request then takes ~1 minute).
services:
  - type: web
    name: karnataka-travel-planner
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Search: PyTorch / sentence-transformers will not fit in 512 MB, so use the light TF-IDF mode.
      - key: RETRIEVAL_BACKEND
        value: tfidf
      # LLM: Groq through its OpenAI-compatible API. Add the two secrets in the Render dashboard.
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false             # paste your Groq key in the dashboard, never in git
      - key: LLM_MODEL
        sync: false             # e.g. openai/gpt-oss-120b, exactly as shown in your Groq console
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_EXTRA_TOKENS
        value: "800"
      - key: LLM_TPM_LIMIT
        value: "7000"
      - key: LLM_TIMEOUT
        value: "40"             # the free instance has very little CPU, so allow slower replies
      - key: PLAN_CACHE_TTL
        value: "3600"