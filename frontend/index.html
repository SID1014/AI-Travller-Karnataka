<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karnataka trip planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  
/* ==========================================
   MYSURU TRAVEL PLANNER — VISUAL REFRESH
   ========================================== */

:root {
  --paper: #F7F5EF;
  --panel: #FFFFFF;
  --ink: #202B49;
  --muted: #697386;
  --line: #E5E3DB;

  --indigo: #293B83;
  --gold: #E6A23C;
  --gold-ink: #202B49;
  --teal: #188577;

  --warn-bg: #FFF2D8;
  --warn-line: #E6A23C;
  --bad: #B94C3B;

  --display: "Bricolage Grotesque", sans-serif;
  --body: "Public Sans", sans-serif;
}

body {
  background:
    radial-gradient(ellipse at 5% 0%, #F1E9D8 0%, transparent 36%),
    var(--paper);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.65;
}

.shell {
  max-width: 1400px;
  gap: 0 44px;
  padding: 36px 32px 72px;
}

/* Header */
header.top {
  padding: 16px 0 26px;
}

header.top h1 {
  font-size: clamp(34px, 4vw, 48px);
  line-height: 1.08;
  letter-spacing: -1.8px;
  font-weight: 800;
  max-width: 580px;
}

header.top p {
  font-size: 15px;
  line-height: 1.7;
  max-width: 48ch;
  color: var(--muted);
  margin-top: 16px;
}

/* Main form card */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 4px solid var(--indigo);
  border-radius: 18px;
  padding: 26px;
  box-shadow: 0 8px 32px rgba(32, 43, 73, .055);
}

label, legend {
  font-size: 13px;
  font-weight: 650;
  color: var(--ink);
  letter-spacing: .1px;
}

.hint {
  color: #9299A5;
  font-size: 12px;
}

/* Form controls */
textarea,
input[type=number],
select {
  width: 100%;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: #FCFBF8;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s,
              background .2s;
}

textarea {
  min-height: 96px;
  resize: vertical;
}

textarea:focus,
input[type=number]:focus,
select:focus {
  border-color: var(--teal);
  background: white;
  box-shadow: 0 0 0 3px rgba(24, 133, 119, .12);
}

/* Spacing */
.row {
  gap: 16px;
  margin-top: 20px;
}

fieldset {
  margin-top: 22px;
}

/* Example prompts */
.examples {
  gap: 8px;
}

.examples button {
  font-size: 12px;
  padding: 6px 12px;
  color: var(--indigo);
  background: #F1F2F9;
  border: 1px solid #E0E3F1;
  border-radius: 100px;
  transition: all .2s ease;
}

.examples button:hover {
  background: #E4E8F8;
  transform: translateY(-1px);
}

/* Interest chips */
.chips {
  gap: 9px;
}

.chips label {
  padding: 8px 15px;
  font-size: 13px;
  border-radius: 100px;
  border: 1px solid var(--line);
  background: #FCFBF8;
  transition: all .2s ease;
}

.chips label:hover {
  border-color: var(--teal);
  background: #EFF8F5;
}

.chips input:checked + label {
  background: var(--indigo);
  border-color: var(--indigo);
  color: white;
}

/* Pace selector */
.seg {
  gap: 7px;
}

.seg label {
  border: 1px solid var(--line);
  border-radius: 9px !important;
  margin: 0;
  padding: 10px 6px;
  background: #FCFBF8;
  transition: all .2s ease;
}

.seg input:checked + label {
  background: var(--indigo);
  border-color: var(--indigo);
  box-shadow: 0 3px 10px rgba(41, 59, 131, .15);
}

/* Actions */
.actions {
  margin-top: 26px;
  gap: 18px;
}

button.primary {
  background: var(--gold);
  color: #202B49;
  border: none;
  border-radius: 10px;
  padding: 13px 25px;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(230, 162, 60, .22);
  transition: all .2s ease;
}

button.primary:hover {
  background: #F0B653;
  transform: translateY(-2px);
  box-shadow: 0 7px 18px rgba(230, 162, 60, .3);
}

button.primary:active {
  transform: translateY(0);
}

.toggle {
  color: var(--muted);
  font-size: 13px;
}

.toggle input {
  accent-color: var(--teal);
}

/* Map */
.map-wrap {
  top: 20px;
}

#map {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #EAECE6;
  box-shadow: 0 8px 32px rgba(32, 43, 73, .07);
  overflow: hidden;
}

/* Results */
.results {
  margin-top: 42px;
}

.results h2 {
  font-size: 32px;
  letter-spacing: -1px;
}

.intro {
  color: var(--muted);
  line-height: 1.7;
}

.understood {
  border-color: var(--line);
  line-height: 1.8;
}

.alerts {
  border: 1px solid #F0D9A9;
  border-left: 4px solid var(--gold);
  border-radius: 12px;
  padding: 17px 20px;
}

/* Daily itinerary */
.day {
  margin-top: 38px;
}

.day-head h3 {
  font-size: 25px;
  letter-spacing: -.5px;
}

.day-head .where {
  color: var(--teal);
  font-size: 14px;
}

.stops {
  border-left-width: 3px;
  padding-left: 22px;
}

.stop {
  padding-bottom: 15px;
}

.stop .bead {
  width: 32px;
  height: 32px;
  line-height: 26px;
  background: var(--day);
  border: 3px solid var(--paper);
  box-shadow: 0 0 0 1px rgba(32, 43, 73, .08);
}

.stop h4 {
  font-size: 19px;
  letter-spacing: -.3px;
}

.stop .blurb {
  line-height: 1.7;
  font-size: 14px;
}

.leg {
  color: var(--muted);
  padding-bottom: 20px;
}

/* Budget section */
.budget {
  margin-top: 42px;
  padding: 22px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
}

.budget h3 {
  font-size: 23px;
}

table.cost td {
  padding: 11px 0;
  border-bottom: 1px solid #F0EFEA;
}

/* Tips and warnings */
.tips {
  border-top: 1px solid var(--line);
  padding-top: 22px;
}

.warnings {
  border-left: 4px solid var(--bad);
  background: #FFF2EF;
  border-radius: 0 10px 10px 0;
  padding: 14px 18px;
}

/* Secondary buttons */
button.secondary {
  border: 1px solid var(--indigo);
  border-radius: 9px;
  color: var(--indigo);
  padding: 10px 18px;
  transition: all .2s ease;
}

button.secondary:hover {
  background: #EEF0F9;
}

/* Map markers */
.pin {
  box-shadow: 0 3px 9px rgba(0,0,0,.2);
}

/* Responsive */
@media (max-width: 960px) {
  .shell {
    padding: 22px 20px 48px;
    gap: 0;
  }

  .map-wrap {
    margin-top: 26px;
  }
}

@media (max-width: 520px) {
  .shell {
    padding: 16px 14px 40px;
  }

  .panel {
    padding: 19px;
    border-radius: 14px;
  }

  header.top h1 {
    font-size: 34px;
  }

  .row.two {
    grid-template-columns: 1fr;
  }

  button.primary {
    width: 100%;
  }

  .budget {
    padding: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
  }
}

</style>
</head>
<body>
<div class="shell">
  <section class="form">
    <header class="top">
      <h1>Plan a trip through Karnataka’s Mysuru belt</h1>
      <p>Say what you like. We choose real places from a checked dataset, order the route so the drives stay short, then write it up.</p>
    </header>

    <form id="planForm" class="panel" novalidate>
      <label for="freeText">Describe your trip <span class="hint">(optional, we read it for days, month, pace and more)</span></label>
      <textarea id="freeText" maxlength="500" placeholder="3 days, temples and filter coffee, relaxed pace, in December"></textarea>
      <div class="examples" id="examples" aria-label="Example trips"></div>

      <div class="row two">
        <div><label for="days">Days</label><input id="days" type="number" min="1" max="7" value="3"></div>
        <div><label for="travelers">Travellers</label><input id="travelers" type="number" min="1" max="12" value="2"></div>
      </div>

      <fieldset>
        <legend>What are you into?</legend>
        <div class="chips" id="interests"></div>
      </fieldset>

      <div class="row two">
        <div><label for="month">Month of travel</label><select id="month"><option value="">Not sure yet</option></select></div>
        <div><label for="start">Start from</label><select id="start"><option value="">No preference</option></select></div>
      </div>

      <fieldset>
        <legend>Pace</legend>
        <div class="seg" role="radiogroup" aria-label="Pace">
          <input type="radio" name="pace" id="pace-relaxed" value="relaxed"><label for="pace-relaxed">Relaxed</label>
          <input type="radio" name="pace" id="pace-balanced" value="balanced" checked><label for="pace-balanced">Balanced</label>
          <input type="radio" name="pace" id="pace-packed" value="packed"><label for="pace-packed">Packed</label>
        </div>
      </fieldset>

      <div class="row two">
        <div><label for="budget">Total budget in ₹ <span class="hint">(optional)</span></label><input id="budget" type="number" min="1000" step="500" placeholder="e.g. 20000"></div>
        <div><label for="stay">Where you’d stay</label>
          <select id="stay">
            <option value="">Not sure yet</option>
            <option value="budget">Budget</option>
            <option value="mid">Mid-range</option>
            <option value="luxury">Luxury</option>
          </select></div>
      </div>

      <div class="actions">
        <button class="primary" id="go" type="submit">Plan my trip</button>
        <!-- <label class="toggle" for="useLlm"><input type="checkbox" id="useLlm" checked> Write it with AI</label> -->
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
  </section>

  <aside class="map-wrap" aria-label="Route map"><div id="map"></div></aside>

  <section class="results" id="results" aria-live="polite"></section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";
  var DAY_COLORS = ["#2B3A8C", "#0E7C70", "#B87A00", "#B23A22", "#7A3E7C", "#2F6B8A", "#6B7A1F"];
  var CATEGORY_LABELS = { "heritage": "Heritage", "culture": "Culture", "spiritual": "Spiritual", "nature": "Nature",
    "wildlife": "Wildlife", "beach": "Beaches", "adventure": "Adventure", "food": "Food and coffee", "hill-station": "Hill stations" };
  var EXAMPLES = [
    "3 days of palaces, heritage and local food around Mysuru, relaxed pace, in December",
  "Weekend by the coast with 3 friends: beaches and Udupi food, under 15k",
  "4 days of waterfalls and misty hills in Chikkamagaluru in July, packed"
  ];
  var $ = function (id) { return document.getElementById(id); };
  var map, layer, markers = {}, meta = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function inr(n) { return "₹" + Math.round(n).toLocaleString("en-IN"); }
  function dur(h) {
    var m = Math.round(h * 60);
    if (m < 60) return m + " min";
    var r = m % 60;
    return Math.floor(m / 60) + " h" + (r ? " " + String(r).padStart(2, "0") + " min" : "");
  }
  function setStatus(msg, isError) { var s = $("status"); s.textContent = msg || ""; s.className = "status" + (isError ? " error" : ""); }

  /* ---------- map */
  function initMap() {
    map = L.map("map", { scrollWheelZoom: true }).setView([13.0, 75.9], 7);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  function drawMap(plan) {
    layer.clearLayers(); markers = {};
    var all = [], prevEnd = null;
    plan.days.forEach(function (d, di) {
      var color = DAY_COLORS[di % DAY_COLORS.length], pts = [];
      d.stops.forEach(function (s, si) {
        var ll = [s.lat, s.lng]; pts.push(ll); all.push(ll);
        var icon = L.divIcon({ className: "", iconSize: [28, 28], iconAnchor: [14, 14],
          html: '<div class="pin" style="background:' + color + '">' + (si + 1) + "</div>" });
        var m = L.marker(ll, { icon: icon, title: s.name }).addTo(layer);
        m.bindPopup("<b>" + esc(s.name) + "</b><br>Day " + d.day + ", " + esc(s.arrive) + " to " + esc(s.depart));
        m.on("click", function () { focusStop(s.id, false); });
        markers[s.id] = m;
      });
      if (pts.length > 1) L.polyline(pts, { color: color, weight: 4, opacity: 0.85 }).addTo(layer);
      if (prevEnd && pts.length) L.polyline([prevEnd, pts[0]], { color: "#7a8499", weight: 2, dashArray: "6 8" }).addTo(layer);
      if (pts.length) prevEnd = pts[pts.length - 1];
    });
    if (all.length) map.fitBounds(all, { padding: [40, 40], maxZoom: 12 });
    setTimeout(function () { map.invalidateSize(); }, 50);
  }
  function focusStop(id, fromList) {
    var li = document.querySelector('[data-stop="' + id + '"]');
    if (li) {
      if (!fromList) li.scrollIntoView({ behavior: "smooth", block: "center" });
      li.classList.remove("flash"); void li.offsetWidth; li.classList.add("flash");
    }
    var m = markers[id];
    if (fromList && m) {
      map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 12), { duration: 0.6 });
      m.openPopup();
      if (window.matchMedia("(max-width: 960px)").matches) $("map").scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  /* ---------- form */
  function buildForm(m) {
    var ch = $("interests");
    m.categories.forEach(function (c) {
      ch.insertAdjacentHTML("beforeend",
        '<input type="checkbox" id="int-' + esc(c) + '" value="' + esc(c) + '"><label for="int-' + esc(c) + '">' +
        esc(CATEGORY_LABELS[c] || c) + "</label>");
    });
    m.months.forEach(function (name, i) { $("month").insertAdjacentHTML("beforeend", '<option value="' + (i + 1) + '">' + esc(name) + "</option>"); });
    m.clusters.forEach(function (c) { $("start").insertAdjacentHTML("beforeend", '<option value="' + esc(c) + '">' + esc(c) + "</option>"); });
    if (m.llm === "off") {
      $("useLlm").checked = false; $("useLlm").disabled = true;
      $("useLlm").parentNode.title = "No AI key is configured on the server, so text is written from templates.";
    }
  }
  function buildExamples() {
    EXAMPLES.forEach(function (t) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = t;
      b.addEventListener("click", function () { $("freeText").value = t; $("freeText").focus(); });
      $("examples").appendChild(b);
    });
  }
  function readForm() {
    var interests = Array.prototype.map.call(document.querySelectorAll("#interests input:checked"), function (i) { return i.value; });
    var num = function (id) { var v = parseInt($(id).value, 10); return isNaN(v) ? null : v; };
    return {
      days: num("days"), travelers: num("travelers"), interests: interests,
      month: $("month").value ? parseInt($("month").value, 10) : null,
      start_cluster: $("start").value || null,
      pace: (document.querySelector('input[name="pace"]:checked') || {}).value || "balanced",
      budget_inr: num("budget"), stay_type: $("stay").value || null,
      free_text: $("freeText").value.trim(), use_llm: $("useLlm").checked
    };
  }

  /* ---------- rendering */
  function understoodHtml(u) {
    var fm = u.from_message || [], parts = [];
    var mark = function (k) { return fm.indexOf(k) >= 0 ? ' <span class="tag">(from your message)</span>' : ""; };
    parts.push("<b>" + u.days + " day" + (u.days > 1 ? "s" : "") + "</b>" + mark("days"));
    parts.push("<b>" + u.travelers + " traveller" + (u.travelers > 1 ? "s" : "") + "</b>" + mark("travelers"));
    parts.push("<b>" + esc(u.pace) + " pace</b>" + mark("pace"));
    if (u.month_name) parts.push("<b>" + esc(u.month_name) + "</b>" + mark("month"));
    if (u.start_cluster) parts.push("starting in <b>" + esc(u.start_cluster) + "</b>" + mark("start_cluster"));
    if (u.interests && u.interests.length) parts.push("interested in <b>" + u.interests.map(function (i) { return esc(CATEGORY_LABELS[i] || i); }).join(", ") + "</b>" + mark("interests"));
    var by = u.parsed_by === "llm" ? "Your message was read by AI." : (u.parsed_by === "rules" ? "Your message was read by keyword matching." : "");
    return "We planned for " + parts.join("; ") + ". " + by;
  }
  function alertsHtml(alerts) {
    var hot = alerts.filter(function (a) { return a.price_level === "high" || a.price_level === "very_high"; });
    var rest = alerts.filter(function (a) { return hot.indexOf(a) < 0; });
    if (!hot.length && !rest.length) return "";
    var h = '<div class="alerts"><h3>' + (hot.length ? "Heads up on prices" : "Prices on your route") + "</h3>";
    hot.forEach(function (a) {
      h += "<p><b>" + esc(a.cluster) + ".</b> " + esc(a.alert) +
        (a.in_peak_season ? ' <span class="peak">You are travelling in peak season here.</span>' : "") + "</p>";
    });
    if (rest.length) {
      h += '<details class="other-prices"><summary>Other areas on this route</summary>';
      rest.forEach(function (a) {
        h += "<p><b>" + esc(a.cluster) + ".</b> " + esc(a.alert) +
          (a.in_peak_season ? " Peak season applies." : "") + "</p>";
      });
      h += "</details>";
    }
    return h + "</div>";
  }
  function dayHtml(d, di, nday) {
    var color = DAY_COLORS[di % DAY_COLORS.length];
    var h = '<article class="day" style="--day:' + color + '">';
    h += '<div class="day-head"><h3>Day ' + d.day + '</h3><span class="where">' + esc(d.base_cluster) + "</span></div>";
    h += '<div class="day-meta">' + esc(d.start_time) + " to " + esc(d.end_time) + ", about " + dur(d.travel_hours) + " driving</div>";
    if (nday && nday.summary) h += '<p class="day-summary">' + esc(nday.summary) + "</p>";
    if (d.transfer_from_previous_day) {
      var t = d.transfer_from_previous_day;
      h += '<div class="transfer">Getting here from day ' + (d.day - 1) + ": " + t.km + " km, about " + dur(t.hours) + ".</div>";
    }
    if (d.from_origin && d.from_origin.km > 3) {
      h += '<div class="transfer">From your start area: ' + d.from_origin.km + " km, about " + dur(d.from_origin.hours) + ".</div>";
    }
    h += '<ol class="stops">';
    var blurbs = {};
    ((nday && nday.stops) || []).forEach(function (s) { blurbs[s.id] = s.blurb; });
    d.stops.forEach(function (s, si) {
      h += '<li class="stop" data-stop="' + esc(s.id) + '"><span class="bead" aria-hidden="true">' + (si + 1) + "</span>";
      h += '<div class="time">' + esc(s.arrive) + " to " + esc(s.depart) + "</div>";
      h += '<h4><button type="button" data-focus="' + esc(s.id) + '" title="Show on map">' + esc(s.name) + "</button></h4>";
      h += '<div class="types">' + s.categories.map(function (c) { return esc(CATEGORY_LABELS[c] || c); }).join(", ") + "</div>";
      if (blurbs[s.id]) h += '<p class="blurb">' + esc(blurbs[s.id]) + "</p>";
      if (s.reasons && s.reasons.length) h += '<p class="why"><b>Why this place:</b> ' + s.reasons.map(esc).join("; ") + ".</p>";
      h += '<div class="links"><a href="' + esc(s.maps_url) + '" target="_blank" rel="noopener">Open in Google Maps</a>';
      if (s.source_url) h += '<a href="' + esc(s.source_url) + '" target="_blank" rel="noopener">Read more</a>';
      h += "</div></li>";
      var next = d.stops[si + 1];
      if (next) h += '<li class="leg" aria-hidden="false">' + next.travel_from_prev_km + " km, " + dur(next.travel_from_prev_hours) + " drive to the next stop</li>";
    });
    return h + "</ol></article>";
  }
  function budgetHtml(b) {
    var h = '<section class="budget"><h3>What it may cost</h3><table class="cost">';
    h += "<tr><td>Entry fees for " + b.travelers + " traveller" + (b.travelers > 1 ? "s" : "") +
      (b.places_with_unknown_fee ? '<div class="small">' + b.places_with_unknown_fee + " place(s) have no fee on file, so this may be low.</div>" : "") +
      "</td><td>" + inr(b.entry_fees_total_inr) + "</td></tr>";
    if (b.stay) {
      h += "<tr><td>Stay: " + b.stay.nights + " night" + (b.stay.nights > 1 ? "s" : "") + ", " + b.stay.rooms + " room" + (b.stay.rooms > 1 ? "s" : "") +
        ", " + esc(b.stay.tier === "mid" ? "mid-range" : b.stay.tier) + '<div class="small">' + esc(b.stay.note) + "</div></td><td>" + inr(b.stay.total_inr) + "</td></tr>";
    } else {
      h += '<tr><td>Stay<div class="small">Choose where you’d stay to include a rough estimate.</div></td><td>Not included</td></tr>';
    }
    h += '<tr class="total"><td>Known costs so far</td><td>' + inr(b.known_total_inr) + "</td></tr></table>";
    if (b.message) h += '<p class="msg' + (b.over_budget ? " bad" : "") + '">' + esc(b.message) + "</p>";
    return h + '<p class="small">' + esc(b.not_included) + "</p></section>";
  }
  function render(res) {
    var plan = res.plan, n = res.narrative || {}, html = "";
    if (!plan.days.length) {
      $("results").innerHTML = "<h2>No matching places</h2><p class=\"intro\">Try more interests, a different month, or a longer trip.</p>";
      layer.clearLayers(); return;
    }
    html += "<h2>" + esc(n.title || "Your itinerary") + "</h2>";
    if (n.intro) html += '<p class="intro">' + esc(n.intro) + "</p>";
    var src = n.source === "llm" ? "Written by AI, using only the places in this plan."
      : n.source === "mixed" ? "Written by AI, with template text where a sentence did not pass our checks."
      : "Written from templates (AI is off or unavailable).";
    html += '<div class="source-note">' + src + (n.note ? " " + esc(n.note) : "") + "</div>";
    html += '<div class="understood">' + understoodHtml(res.understood) + "</div>";
    html += alertsHtml(res.alerts || []);
    var nd = {}; (n.days || []).forEach(function (d) { nd[d.day] = d; });
    plan.days.forEach(function (d, i) { html += dayHtml(d, i, nd[d.day]); });
    if (n.tips && n.tips.length) html += '<section class="tips"><h3>Good to know</h3><ul>' + n.tips.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></section>";
    html += budgetHtml(res.budget);
    if (plan.warnings && plan.warnings.length) html += '<div class="warnings"><ul>' + plan.warnings.map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("") + "</ul></div>";
    html += '<div class="footer-actions"><button type="button" class="secondary" id="printBtn">Save as PDF</button></div>';
    html += '<p class="small">Opening hours change, so check them before you go. Drive times are estimates.</p>';
    $("results").innerHTML = html;
    drawMap(plan);
    $("printBtn").addEventListener("click", function () { window.print(); });
  }

  /* ---------- submit */
  async function submit(ev) {
    ev.preventDefault();
    var btn = $("go"); btn.disabled = true; btn.textContent = "Planning…";
    setStatus("Choosing places and ordering the route. AI writing can take a few seconds.");
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 70000);
    try {
      var r = await fetch("/api/plan", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(readForm()), signal: ctl.signal });
      if (!r.ok) {
        var detail = ""; try { detail = (await r.json()).detail; } catch (e) {}
        if (Array.isArray(detail)) detail = "Please check the form: days must be 1 to 7 and travellers 1 to 12.";
        throw new Error(detail || ("The server returned " + r.status + "."));
      }
      var res = await r.json();
      render(res);
      var m = res.meta;
      setStatus("Done in " + m.seconds + " s. Text by " + (m.llm === "off" ? "templates" : "AI") + ".");
      $("results").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {
      setStatus(e.name === "AbortError" ? "That took too long. Try again, or untick “Write it with AI”." :
        "Could not plan the trip: " + e.message, true);
    } finally { clearTimeout(timer); btn.disabled = false; btn.textContent = "Plan my trip"; }
  }

  async function init() {
    initMap(); buildExamples();
    try {
      var r = await fetch("/api/meta"); if (!r.ok) throw new Error(r.status);
      meta = await r.json(); buildForm(meta);
    } catch (e) {
      setStatus("The planner server is not reachable. Start it and reload this page.", true);
      $("go").disabled = true;
    }
    $("planForm").addEventListener("submit", submit);
    $("results").addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-focus]"); if (b) focusStop(b.getAttribute("data-focus"), true);
    });
  }
  init();
})();
</script>
</body>
</html>
